limit_req_zone $binary_remote_addr zone=computeit_contact:10m rate=5r/m;

# http://computeit.sk, http://www.computeit.sk → https://computeit.sk
server {
    listen 80;
    listen [::]:80;
    server_name computeit.sk www.computeit.sk;

    return 301 https://computeit.sk$request_uri;
}

# https://www.computeit.sk → https://computeit.sk
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.computeit.sk;

    ssl_certificate     /etc/letsencrypt/live/computeit.sk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/computeit.sk/privkey.pem;

    return 301 https://computeit.sk$request_uri;
}

# https://computeit.sk — the site
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name computeit.sk;

    ssl_certificate     /etc/letsencrypt/live/computeit.sk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/computeit.sk/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 64k;

    # Inherited by both locations below.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://127.0.0.1:8000;
    }

    location = /api/contact {
        limit_req zone=computeit_contact burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
    }
}

